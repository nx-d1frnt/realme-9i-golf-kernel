<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D12"/>
      <stop offset="100%" stop-color="#0E151D"/>
    </linearGradient>

    <radialGradient id="soft-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(640 310) rotate(90) scale(260 440)">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#090D12" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <g id="Background">
    <rect width="1280" height="640" fill="url(#bg-grad)"/>
    <rect width="1280" height="640" fill="url(#soft-glow)"/>
  </g>

