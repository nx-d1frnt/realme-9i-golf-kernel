    <text x="640" y="320" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="112" font-weight="800" letter-spacing="-3.5" fill="#F8FAFC">Golf<tspan fill="url(#accent-grad)">Core</tspan></text>

    <rect x="600" y="352" width="80" height="3" rx="1.5" fill="url(#accent-grad)" opacity="0.85"/>

    <text x="640" y="398" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="24" font-weight="500" letter-spacing="0.5" fill="#94A3B8">Realme 9i 4G  •  Linux 4.19.157</text>
